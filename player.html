<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html,body{
margin:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

video{
width:100vw;
height:100vh;
object-fit:contain;
}
</style>

</head>

<body>

<video id="video" autoplay controls playsinline></video>

<script>

const folder = window.location.pathname.split("/")[1];

fetch("/api/video/" + folder)
.then(r => r.json())
.then(data => {

    const v=document.getElementById("video");

    v.src=data.video;

    v.play();

});

</script>

</body>
</html>
